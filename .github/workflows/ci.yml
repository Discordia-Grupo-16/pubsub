# This repo does not call the shared discordia-ci workflows: it is a library in
# two languages, with no image to build and a broker to test against. Every step
# still goes through `make`, as the CI contract asks.
#
# No security job yet: gosec flags G404 in retry.go (math/rand for the backoff
# jitter). It joins once that line carries its #nosec; the vuln and sast targets
# are already in the Makefile and should run on Go 1.25, not on go.mod's version,
# so that govulncheck reports this repo's dependencies and not the old toolchain.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go.mod's version is the minimum the library promises its consumers, so
      # that is the one lint, test and build prove.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Catches a go.mod that drifted from the imports actually in the code.
      - name: Verify go.mod is tidy
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]

    # The integration tests skip themselves without a reachable broker, and a
    # test that silently skips in CI is a test that does not exist. Both clients
    # default to amqp://localhost:5672/, so no env var is injected.
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - if: matrix.language == 'go'
        name: Test with coverage gate
        run: make cover COVER_MIN=70

      - if: matrix.language == 'go' && always()
        name: Publish the coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

      # requires-python's floor, for the same reason as go.mod's version.
      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - if: matrix.language == 'python'
        name: Install the client and its dev extras
        run: pip install -e "python[dev]"

      - if: matrix.language == 'python'
        name: Test with coverage gate
        run: make cover-python COVER_MIN=70

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  # A credential anywhere in the repository, including earlier commits,
  # invalidates the evaluation. This repo is public, which makes it worse.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Do not use gitleaks/gitleaks-action@v2: it requires GITLEAKS_LICENSE on
      # organization repos and fails in ~5s with an error that does not explain why.
      - name: Install gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan git history
        run: gitleaks detect --source . --verbose
